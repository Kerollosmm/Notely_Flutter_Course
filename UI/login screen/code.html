<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Notely Login</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f9f506",
                        "background-light": "#f8f8f5",
                        "background-dark": "#23220f",
                        "text-dark": "#1c1c0d",
                        "text-light": "#e9e8ce", 
                        "placeholder": "#9e9d47",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex min-h-screen w-full flex-col overflow-hidden">
<!-- Main Content Container centered vertically for mobile ease -->
<div class="flex flex-1 flex-col items-center justify-center px-6 py-10 w-full max-w-md mx-auto">
<!-- Header Section -->
<div class="w-full text-center mb-8">
<!-- Logo / Brand Name -->
<div class="flex items-center justify-center gap-3 mb-4">
<div class="flex items-center justify-center w-12 h-12 rounded-xl bg-primary text-text-dark">
<span class="material-symbols-outlined !text-[32px]">edit_note</span>
</div>
<h1 class="text-text-dark dark:text-white tracking-tight text-[32px] font-bold leading-tight">Notely</h1>
</div>
<h2 class="text-text-dark dark:text-white text-[22px] font-bold leading-tight tracking-[-0.015em] pt-2">Welcome back!</h2>
<p class="text-placeholder dark:text-gray-400 text-sm font-medium pt-2">Please sign in to continue to your notes.</p>
</div>
<!-- Form Section -->
<div class="w-full flex flex-col gap-5">
<!-- Email Field -->
<label class="flex flex-col w-full">
<p class="text-text-dark dark:text-white text-base font-medium leading-normal pb-2 ml-1">Email Address</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-full text-text-dark dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#e9e8ce] dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-primary h-14 placeholder:text-placeholder dark:placeholder:text-gray-500 p-[15px] px-6 text-base font-normal leading-normal transition-all duration-200" placeholder="name@example.com" type="email" value=""/>
</label>
<!-- Password Field -->
<label class="flex flex-col w-full">
<p class="text-text-dark dark:text-white text-base font-medium leading-normal pb-2 ml-1">Password</p>
<div class="relative flex w-full items-center">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-full text-text-dark dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#e9e8ce] dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-primary h-14 placeholder:text-placeholder dark:placeholder:text-gray-500 p-[15px] px-6 pr-12 text-base font-normal leading-normal transition-all duration-200" placeholder="••••••••" type="password" value=""/>
<button class="absolute right-4 text-placeholder dark:text-gray-400 flex items-center justify-center hover:text-text-dark dark:hover:text-white transition-colors" type="button">
<span class="material-symbols-outlined !text-[24px]">visibility</span>
</button>
</div>
</label>
<!-- Forgot Password Link -->
<div class="flex justify-end w-full -mt-2">
<button class="cursor-pointer text-text-dark dark:text-white text-sm font-bold leading-normal tracking-[0.015em] hover:opacity-70 transition-opacity">
                        Forgot Password?
                    </button>
</div>
<!-- Login Button -->
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-full h-14 bg-primary hover:bg-yellow-300 text-text-dark text-base font-bold leading-normal tracking-[0.015em] mt-4 shadow-sm hover:shadow-md transition-all duration-200">
<span class="truncate">Log In</span>
</button>
<!-- Social Login Options (Optional but modern) -->
<div class="flex flex-col items-center gap-4 mt-2">
<div class="flex items-center gap-2 w-full">
<div class="h-px bg-[#e9e8ce] dark:bg-gray-700 flex-1"></div>
<span class="text-xs font-medium text-placeholder dark:text-gray-500 uppercase tracking-wider">Or continue with</span>
<div class="h-px bg-[#e9e8ce] dark:bg-gray-700 flex-1"></div>
</div>
<div class="flex gap-4 justify-center w-full">
<button class="flex-1 h-12 flex items-center justify-center gap-2 rounded-full border border-[#e9e8ce] dark:border-gray-700 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
<img alt="Google" class="w-5 h-5" data-alt="Google G logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDgOz7WV8HCP5zMQuirseN3NQDaBBEfVRPqSLL6vliofKr6DAlRFmMvveT1Lh7v9bEjKQXnRs6a1WEVXrDw_OYy8IvzAWsFIq40siwvCIOjYsxwgVPyeIt44srQvsoonv07EaTw2m-M-6-JmKcjEyW2aNdUsQCXdWweyyjD1rOlyqgLPqgZWjY7eez1BIK_KXz93n2hWAO1X_KNx9_rW6d4jZxVTKx1B1t1B327kOZUTXUN-fiXMD6HlRDlYvZlG7HwSDNtTzn3suE"/>
<span class="text-sm font-medium text-text-dark dark:text-white">Google</span>
</button>
<button class="flex-1 h-12 flex items-center justify-center gap-2 rounded-full border border-[#e9e8ce] dark:border-gray-700 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
<span class="material-symbols-outlined text-text-dark dark:text-white !text-[22px]">ios</span>
<span class="text-sm font-medium text-text-dark dark:text-white">Apple</span>
</button>
</div>
</div>
</div>
<!-- Footer Section -->
<div class="mt-auto pt-10 text-center w-full">
<p class="text-text-dark dark:text-white text-sm">
                    Don't have an account? 
                    <button class="font-bold text-text-dark dark:text-primary underline decoration-2 decoration-primary/30 hover:decoration-primary underline-offset-4 transition-all">Register</button>
</p>
</div>
</div>
</div>
</body></html>
